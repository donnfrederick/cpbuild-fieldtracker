name: Admin - Cleanup workflow runs

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Delete runs older than N days'
        default: '14'
        required: true
      branches:
        description: 'Comma-separated branches to keep/delete from (blank = all branches)'
        default: ''
        required: false
      statuses:
        description: 'Conclusions to delete (comma-separated). Ex: success,failure,cancelled'
        default: 'success,failure,cancelled'
        required: false
      delete_all:
        description: 'Ignore age/status/branch filters and delete ALL completed runs'
        type: boolean
        default: false
        required: false
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        default: false
        required: false

  # Scheduled: 03:00 UTC on the 1st and 15th (roughly "every 14 days")
  schedule:
    - cron: '0 3 1,15 * *'

permissions:
  actions: write # needed to delete runs
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Purge completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            // Fallbacks so scheduled runs work without manual inputs
            const olderRaw    = core.getInput('older_than_days') || '14';
            const older       = Number.isFinite(parseInt(olderRaw, 10)) ? parseInt(olderRaw, 10) : 14;

            const statusesRaw = core.getInput('statuses') || 'success,failure,cancelled';
            const branchesRaw = core.getInput('branches') || '';

            const deleteAll   = (core.getInput('delete_all') || 'false') === 'true';
            const dryRun      = (core.getInput('dry_run') || 'false') === 'true';

            const conclusions = statusesRaw.split(',').map(s => s.trim()).filter(Boolean);
            const branches    = branchesRaw.split(',').map(b => b.trim()).filter(Boolean);

            const cutoffMs = Date.now() - older*24*60*60*1000;
            const selfRunId = context.runId;

            let scanned = 0, candidates = 0, deleted = 0;

            // Iterate all workflows in the repo
            for await (const wfPage of github.paginate.iterator(
              github.rest.actions.listRepoWorkflows,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            )) {
              for (const wf of wfPage.data) {
                // For each workflow, iterate its runs
                for await (const runPage of github.paginate.iterator(
                  github.rest.actions.listWorkflowRuns,
                  { owner: context.repo.owner, repo: context.repo.repo, workflow_id: wf.id, per_page: 100 }
                )) {
                  for (const run of runPage.data) {
                    scanned++;
                    if (run.id === selfRunId) continue;            // never delete current run
                    if (run.status !== 'completed') continue;      // only completed runs

                    // Optional branch filter
                    if (branches.length && !branches.includes(run.head_branch || '')) continue;

                    // Age & status filters (unless delete_all)
                    const createdMs = new Date(run.created_at).getTime();
                    const isOld = createdMs < cutoffMs;
                    const matchesConclusion = conclusions.length ? conclusions.includes(run.conclusion || '') : true;

                    const isCandidate = deleteAll ? true : (isOld && matchesConclusion);
                    if (!isCandidate) continue;

                    candidates++;
                    if (!dryRun) {
                      try {
                        await github.rest.actions.deleteWorkflowRun({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: run.id,
                        });
                        deleted++;
                      } catch (err) {
                        core.warning(`Failed to delete run ${run.id} (${wf.name} @ ${run.head_branch}): ${err}`);
                      }
                    }
                  }
                }
              }
            }

            const headline = dryRun
              ? `Would delete ${candidates} run(s) out of ${scanned} scanned.`
              : `Deleted ${deleted} run(s) out of ${scanned} scanned.`;

            core.info(headline);
            await core.summary
              .addHeading('Actions workflow runs cleanup')
              .addRaw(`Older than days: ${older}\n`)
              .addRaw(`Branches filter: ${branches.join(', ') || '(all)'}\n`)
              .addRaw(`Conclusions: ${conclusions.join(', ') || '(any)'}\n`)
              .addRaw(`Delete all override: ${deleteAll}\n`)
              .addRaw(`Dry run: ${dryRun}\n\n`)
              .addRaw(headline)
              .write();
