name: Admin - Delete old Actions caches

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Delete caches older than N days'
        default: '14'
        required: true
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        default: false
        required: false

jobs:
  cleanup_caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write # required to delete caches
      contents: read
    steps:
      - name: Delete old caches via API
        uses: actions/github-script@v7
        with:
          script: |
            const days = parseInt(core.getInput('older_than_days'), 10);
            const dryRun = core.getInput('dry_run') === 'true';
            const cutoff = Date.now() - days*24*60*60*1000;

            let total = 0, candidates = 0, deleted = 0;
            let bytes = 0, bytesDeleted = 0;
            const lines = [];

            for await (const page of github.paginate.iterator(
              github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            )) {
              const caches = page.data.actions_caches || [];
              for (const c of caches) {
                total++;
                const touched = new Date(c.last_accessed_at || c.created_at).getTime();
                const size = c.size_in_bytes || 0;
                bytes += size;

                if (touched < cutoff) {
                  candidates++;
                  lines.push(`• key="${c.key}"  ref="${c.ref}"  last_accessed=${c.last_accessed_at}  created=${c.created_at}`);
                  if (!dryRun) {
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: c.id,
                    });
                    deleted++;
                    bytesDeleted += size;
                  }
                }
              }
            }

            const toMB = b => (b/1024/1024).toFixed(2) + ' MB';
            const header = dryRun
              ? `Would delete ${candidates} cache(s) older than ${days} day(s).`
              : `Deleted ${deleted} of ${candidates} old cache(s).`;

            core.info(`Total caches scanned: ${total}, total size ~${toMB(bytes)}`);
            core.info(`${header} Freed approx ${toMB(bytesDeleted)}.`);

            await core.summary
              .addHeading('Actions cache cleanup')
              .addRaw(`${header}\n`)
              .addRaw(`Total caches scanned: **${total}** (approx ${toMB(bytes)})\n\n`)
              .addRaw(`Freed approx: **${toMB(bytesDeleted)}**\n\n`)
              .addList(lines.slice(0, 50))
              .write();
