version: '3.8'

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql-container
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourStrong!Passw0rd'
    ports:
      - '1433:1433'
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - dev-network

  redis:
    image: redis:latest
    container_name: redis-container
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - dev-network

networks:
  dev-network:

volumes:
  sql_data:
